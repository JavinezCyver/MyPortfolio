name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "developer-portfolio/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: developer-portfolio
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: developer-portfolio/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build
        env:
          PORTFOLIO_BASE_PATH: "/${{ github.event.repository.name }}/"

      - name: Upload built website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: developer-portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
